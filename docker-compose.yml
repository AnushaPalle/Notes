services:
  core:
    build: ./core
    environment:
      SPRING_PROFILES_ACTIVE: elk
      LOGSTASH_HOST: logstash
      PULSEBOARD_API_KEYS: ${PULSEBOARD_API_KEYS:-demo-key}
      PULSEBOARD_ADMIN_KEYS: ${PULSEBOARD_ADMIN_KEYS:-demo-admin-key}
      PULSEBOARD_WEBHOOK_SECRET: ${PULSEBOARD_WEBHOOK_SECRET:-whsec_demo}
      PULSEBOARD_NOTIFIER_URL: http://notifier:3000
    ports:
      - "8080:8080"
    depends_on: [logstash, notifier]

  notifier:
    build: ./notifier
    ports:
      - "3000:3000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on: [elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on: [elasticsearch]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on: [core]
