spring:
  application:
    name: pulseboard-core
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pulseboard;DB_CLOSE_DELAY=-1}
  sql:
    init:
      mode: always
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

pulseboard:
  ingest:
    max-attempts: 3
    backoff-ms: 200
    queue-capacity: 1000
  security:
    # No defaults on purpose: with nothing configured every /api request is rejected.
    api-keys: ${PULSEBOARD_API_KEYS:}
    admin-keys: ${PULSEBOARD_ADMIN_KEYS:}
    webhook-secret: ${PULSEBOARD_WEBHOOK_SECRET:}
