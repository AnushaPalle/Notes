global:
  scrape_interval: 10s

scrape_configs:
  - job_name: shopflow-monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["monolith:8080"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8081"]
